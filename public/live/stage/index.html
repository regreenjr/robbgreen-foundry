<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The floor · Robb Green</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b09">
<!--
  THE FLOOR BOARD. Projected behind the stage while the room scans.

  The point of this page is that the moment stops being four hundred private phone
  screens and becomes one thing the room watches together. Brands land as they are
  claimed, the count runs, and a claimed brand shows the ad that was already waiting
  for it.

  Reads /api/live-feed, which returns brand + kind + slug and deliberately NO EMAIL —
  this is on a projector in front of a hundred people.
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --iron-0:#0a0b09; --iron-1:#11130f; --iron-2:#191c15;
  --bone:#e9e7da; --bone-dim:#8d8e7c;
  --melt:#a8f53e; --melt-hot:#eeffc9;
  --edge:rgba(233,231,218,.14);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{
  margin:0;background:var(--iron-0);color:var(--bone);font-family:var(--sans);
  overflow:hidden;display:flex;flex-direction:column;
}
header{
  display:flex;align-items:baseline;gap:clamp(20px,3vw,54px);
  padding:clamp(16px,2.2vh,30px) clamp(24px,3vw,56px) clamp(10px,1.4vh,18px);
  border-bottom:1px solid var(--edge);flex:0 0 auto;
}
.title{font-size:clamp(20px,2.4vw,38px);font-weight:800;letter-spacing:-.02em;margin:0}
.title em{font-style:normal;color:var(--melt)}
.counts{margin-left:auto;display:flex;gap:clamp(18px,2.6vw,48px)}
.count{text-align:right}
.count b{display:block;font-size:clamp(34px,5.2vw,86px);line-height:.92;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{font-family:var(--mono);font-size:clamp(9px,.8vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim)}
.count.built b{color:var(--melt)}

main{flex:1;overflow:hidden;padding:clamp(14px,2vh,28px) clamp(24px,3vw,56px)}
#grid{
  display:grid;gap:clamp(10px,1.1vw,20px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(150px,13vw,230px),1fr));
  align-content:start;height:100%;overflow:hidden;
}
.tile{
  position:relative;border:1px solid var(--edge);background:var(--iron-1);
  border-radius:3px;overflow:hidden;animation:land .62s cubic-bezier(.16,1,.3,1) both;
}
.tile .shot{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--iron-2)}
.tile .lab{padding:9px 11px 11px;display:flex;align-items:baseline;gap:8px}
.tile .nm{font-weight:700;font-size:clamp(12px,1vw,17px);letter-spacing:-.01em;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tag{margin-left:auto;font-family:var(--mono);font-size:clamp(8px,.62vw,10px);letter-spacing:.1em;flex:0 0 auto}
.tile.match{border-color:rgba(168,245,62,.42)}
.tile.match .tag{color:var(--melt)}
.tile.queue{background:var(--iron-2)}
.tile.queue .tag{color:var(--bone-dim)}
.tile.queue .shot{display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#5b5d50;
  background:repeating-linear-gradient(-45deg,#141710,#141710 9px,#181c13 9px,#181c13 18px)}
.tile.fresh{box-shadow:0 0 0 2px var(--melt),0 0 44px rgba(168,245,62,.34);animation:land .62s cubic-bezier(.16,1,.3,1) both, cool 3.2s ease-out .62s forwards}
@keyframes land{from{opacity:0;transform:translateY(-26px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cool{to{box-shadow:0 0 0 0 rgba(168,245,62,0),0 0 0 rgba(168,245,62,0)}}

.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
}
.empty h2{font-size:clamp(28px,4.2vw,64px);font-weight:800;letter-spacing:-.02em;margin:0}
.empty p{font-family:var(--mono);font-size:clamp(11px,1vw,15px);letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin:0}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--melt);animation:beat 1.7s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

footer{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:clamp(8px,1.2vh,16px) clamp(24px,3vw,56px) clamp(12px,1.8vh,22px);
  border-top:1px solid var(--edge);font-family:var(--mono);
  font-size:clamp(10px,.95vw,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);
}
footer .url{color:var(--melt);letter-spacing:.1em}
footer .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--melt)}
.dot.stale{background:#c8632f}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1 class="title">Your ads <em>already exist</em></h1>
  <div class="counts">
    <div class="count built"><b id="c-built">0</b><span>Built</span></div>
    <div class="count"><b id="c-queued">0</b><span>In the queue</span></div>
  </div>
</header>

<main>
  <div id="empty" class="empty">
    <div class="pulse"></div>
    <h2>Scan the code.</h2>
    <p>robbgreen.com/mm4</p>
  </div>
  <div id="grid" hidden></div>
</main>

<footer>
  <span>Scan to find yours</span><span class="url">robbgreen.com/mm4</span>
  <span class="right"><span id="dot" class="dot"></span><span id="status">Live</span></span>
</footer>

<script>
(function(){
  "use strict";
  var FEED = "https://bfm-demos.vercel.app/api/live-feed?mins=300";
  var SHOT = "https://bfm-demos.vercel.app/";
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var seen = Object.create(null);
  var first = true;

  function key(e){ return e.kind + "|" + e.brand.toLowerCase() + "|" + e.ts; }

  function tile(e, fresh){
    var d = document.createElement("div");
    d.className = "tile " + e.kind + (fresh ? " fresh" : "");
    if (e.kind === "match" && e.slug){
      var img = document.createElement("img");
      img.className = "shot"; img.loading = "eager"; img.alt = "";
      img.src = SHOT + e.slug + "/k1.jpg";
      // a missing hero must never leave a broken icon on a projector
      img.onerror = function(){ var s=document.createElement("div"); s.className="shot"; s.textContent="BUILT"; d.replaceChild(s,img); };
      d.appendChild(img);
    } else {
      var s = document.createElement("div");
      s.className = "shot"; s.textContent = "QUEUED";
      d.appendChild(s);
    }
    var lab = document.createElement("div"); lab.className = "lab";
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = e.brand;
    var tg = document.createElement("span"); tg.className = "tag";
    tg.textContent = e.kind === "match" ? "BUILT" : "NEXT";
    lab.appendChild(nm); lab.appendChild(tg); d.appendChild(lab);
    return d;
  }

  function paint(data){
    var evs = data.events || [];
    var added = 0;
    for (var i = 0; i < evs.length; i++){
      var e = evs[i], k = key(e);
      if (seen[k]) continue;
      seen[k] = 1;
      // newest first, so the thing that just happened is where the eye already is
      grid.insertBefore(tile(e, !first), grid.firstChild);
      added++;
    }
    // keep the projector from ever scrolling; the board shows the recent face of the room
    while (grid.children.length > 60) grid.removeChild(grid.lastChild);
    document.getElementById("c-built").textContent = data.matched || 0;
    document.getElementById("c-queued").textContent = data.queued || 0;
    var any = (data.matched || 0) + (data.queued || 0) > 0;
    empty.hidden = any; grid.hidden = !any;
    first = false;
    return added;
  }

  function mark(ok){
    document.getElementById("dot").className = "dot" + (ok ? "" : " stale");
    document.getElementById("status").textContent = ok ? "Live" : "Reconnecting";
  }

  function poll(){
    fetch(FEED, {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.ok){ paint(d); mark(true); } else mark(false); })
      .catch(function(){ mark(false); });      // keep whatever is on screen
  }
  poll(); setInterval(poll, 2000);

  // F = fullscreen for the projector. R = clear the board for a rehearsal run.
  addEventListener("keydown", function(ev){
    var k = ev.key.toLowerCase();
    if (k === "f"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    if (k === "r"){ seen = Object.create(null); grid.innerHTML = ""; first = true; poll(); }
  });
})();
</script>
</body>
</html>
