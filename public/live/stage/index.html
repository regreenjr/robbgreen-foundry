<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The floor · Robb Green</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0b09">
<!--
  THE FLOOR BOARD. Projected behind the stage.

  All 47 built pages are on the wall from the first second — the room should see the
  scale before anyone scans, and Robb can click any tile on stage to open that brand's
  page during the "For Them" beat. Scanning then LIGHTS a tile rather than creating it,
  and walk-ups append at the end.

  Reads /api/live-feed, which returns brand + kind + slug and deliberately NO EMAIL:
  this is on a projector in front of a hundred people.
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --iron-0:#0a0b09; --iron-1:#11130f; --iron-2:#191c15;
  --bone:#e9e7da; --bone-dim:#8d8e7c;
  --melt:#a8f53e; --melt-hot:#eeffc9;
  --edge:rgba(233,231,218,.13);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--iron-0);color:var(--bone);font-family:var(--sans);
  overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

header{display:flex;align-items:center;gap:clamp(16px,2.4vw,44px);
  padding:clamp(12px,1.8vh,24px) clamp(20px,2.4vw,48px) clamp(8px,1.1vh,14px);
  border-bottom:1px solid var(--edge);flex:0 0 auto}
.title{font-size:clamp(17px,1.9vw,32px);font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap}
.title em{font-style:normal;color:var(--melt)}
.ticker{flex:1;min-width:0;font-family:var(--mono);font-size:clamp(10px,1.05vw,17px);
  letter-spacing:.1em;text-transform:uppercase;color:var(--melt);opacity:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .25s}
.ticker.on{opacity:1}
.counts{display:flex;gap:clamp(14px,1.9vw,38px);flex:0 0 auto}
.count{text-align:right}
.count b{display:block;font-size:clamp(24px,3.1vw,54px);line-height:.9;font-weight:800;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{font-family:var(--mono);font-size:clamp(8px,.66vw,11px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--bone-dim)}
.count.lit b{color:var(--melt)}

main{flex:1;min-height:0;padding:clamp(10px,1.4vh,20px) clamp(20px,2.4vw,48px)}
#grid{display:grid;height:100%;align-content:start;
  gap:clamp(5px,.55vw,11px);
  grid-template-columns:repeat(auto-fill,minmax(var(--tile,120px),1fr))}

.tile{position:relative;display:block;text-decoration:none;color:inherit;
  border:1px solid var(--edge);background:var(--iron-1);border-radius:3px;overflow:hidden;
  transition:transform .16s ease, border-color .3s, box-shadow .5s}
.tile:hover{transform:translateY(-3px) scale(1.035);border-color:var(--melt);z-index:5}
.tile .shot{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--iron-2)}
.tile .lab{padding:4px 6px 6px;display:flex;align-items:center;gap:5px}
.tile .nm{font-weight:700;font-size:clamp(8px,.62vw,12px);letter-spacing:-.01em;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tile .tag{font-family:var(--mono);font-size:clamp(6px,.42vw,9px);letter-spacing:.08em;
  color:#5f6154;flex:0 0 auto}

/* claimed: someone in the room scanned and took this one */
.tile.lit{border-color:var(--melt)}
.tile.lit .tag{color:var(--melt)}
.tile.lit .shot{filter:none}
.tile:not(.lit):not(.queued) .shot{filter:saturate(.88) brightness(.84)}
.tile.flare{animation:flare 3.4s ease-out both;z-index:4}
@keyframes flare{
  0%{box-shadow:0 0 0 3px var(--melt),0 0 60px rgba(168,245,62,.55);transform:scale(1.1)}
  22%{transform:scale(1.02)}
  100%{box-shadow:0 0 0 1px rgba(168,245,62,0),0 0 0 rgba(168,245,62,0);transform:none}
}
/* a brand nobody had built yet, walking up during the talk */
.tile.queued{background:var(--iron-2);border-style:dashed}
.tile.queued .shot{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:clamp(7px,.5vw,10px);letter-spacing:.14em;color:#5b5d50;
  background:repeating-linear-gradient(-45deg,#141710,#141710 8px,#181c13 8px,#181c13 16px)}
.tile.queued .tag{color:var(--bone-dim)}
.tile.new{animation:land .6s cubic-bezier(.16,1,.3,1) both}
@keyframes land{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}

footer{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:clamp(6px,1vh,13px) clamp(20px,2.4vw,48px) clamp(9px,1.4vh,18px);
  border-top:1px solid var(--edge);font-family:var(--mono);
  font-size:clamp(9px,.85vw,14px);letter-spacing:.13em;text-transform:uppercase;color:var(--bone-dim)}
footer .url{color:var(--melt);letter-spacing:.09em}
footer .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--melt)}
.dot.stale{background:#c8632f}
</style>
</head>
<body>
<header>
  <h1 class="title">Your ads <em>already exist</em></h1>
  <div id="ticker" class="ticker"></div>
  <div class="counts">
    <div class="count"><b id="c-built">47</b><span>Built</span></div>
    <div class="count lit"><b id="c-lit">0</b><span>Claimed</span></div>
    <div class="count"><b id="c-q">0</b><span>In the queue</span></div>
  </div>
</header>

<main><div id="grid"></div></main>

<footer>
  <span>Scan to find yours</span><span class="url">robbgreen.com/mm4</span>
  <span class="right"><span id="dot" class="dot"></span><span id="status">Live</span></span>
</footer>

<script>
(function(){
  "use strict";
  var FEED = "https://bfm-demos.vercel.app/api/live-feed?mins=300";
  var BASE = "https://bfm-demos.vercel.app/";
  var BRANDS = /*BRANDS*/[{"s":"3dwalls","n":"3D Walls By Design"},{"s":"adaptiveteams","n":"Adaptive Teams"},{"s":"advancedbio","n":"Advanced Bionutritionals"},{"s":"amvital","n":"AMVital"},{"s":"annex","n":"Annex"},{"s":"badassmoto","n":"Badass Moto"},{"s":"bdstoneworks","n":"Black Diamond Stoneworks"},{"s":"calavive","n":"Calavive"},{"s":"castilesoap","n":"Carolina Castile Soap"},{"s":"catalxst","n":"CatalXst"},{"s":"colormorelines","n":"Color More Lines"},{"s":"customempire","n":"Custom Empire Shop"},{"s":"digitalxecutive","n":"Digital Xecutive"},{"s":"ebusinesspros","n":"eBusiness Pros"},{"s":"11brands","n":"Eleven Brands"},{"s":"engin8","n":"Engin8"},{"s":"feartolove","n":"Fear to Love"},{"s":"formulation","n":"Formulation Factory"},{"s":"gro3x","n":"Gro3X"},{"s":"hadleydesigns","n":"Hadley Designs"},{"s":"havercamp","n":"Havercamp Party Products"},{"s":"hopecompany","n":"Hope's"},{"s":"houseofcyn","n":"House of Cyn"},{"s":"lavishcomforts","n":"Lavish Comforts"},{"s":"livewise","n":"Live Wise Naturals"},{"s":"mattharris","n":"Matt Harris Designs"},{"s":"megarhino","n":"MegaRhino"},{"s":"miraiclinical","n":"Mirai Clinical"},{"s":"oneil","n":"O'Neil Software"},{"s":"proteinmilkshake","n":"Protein Milkshake"},{"s":"rebrelief","n":"REB Relief"},{"s":"refreshmywater","n":"Refresh Premium Filters"},{"s":"ripvan","n":"Rip Van"},{"s":"naturalorganic","n":"Skin Perfection"},{"s":"smartish","n":"Smartish"},{"s":"snoozeshade","n":"SnoozeShade"},{"s":"spoton","n":"Spot On"},{"s":"stripfast5000","n":"StripFast5000"},{"s":"superblanky","n":"Super Blanky"},{"s":"superbaking","n":"Superbaking"},{"s":"tcpglobal","n":"TCP Global"},{"s":"ultimateclub","n":"Ultimate Health"},{"s":"ultimatewasher","n":"Ultimate Washer"},{"s":"upperechelon","n":"Upper Echelon Products"},{"s":"viscosoft","n":"ViscoSoft"},{"s":"waterfilters","n":"WaterFilters.NET"},{"s":"zerotoip","n":"ZeroToIP"}]/*END*/;

  var grid = document.getElementById("grid");
  var tiles = Object.create(null);   // slug -> element
  var lit = Object.create(null);
  var queued = Object.create(null);
  var seen = Object.create(null);
  var firstPass = true;

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

  // every built page is on the wall from the first second, and every tile is a link:
  // Robb clicks one on stage during "For Them" and that brand's page opens.
  function build(){
    BRANDS.forEach(function(b){
      var a = el("a","tile");
      a.href = BASE + "p/" + b.s;
      a.target = "_blank"; a.rel = "noopener";
      a.title = b.n;
      var img = el("img","shot");
      img.loading = "eager"; img.alt = b.n;
      img.src = BASE + b.s + "/k1.jpg";
      img.onerror = function(){ var d=el("div","shot","BUILT"); a.replaceChild(d,img); };
      a.appendChild(img);
      var lab = el("div","lab");
      lab.appendChild(el("span","nm",b.n));
      lab.appendChild(el("span","tag","BUILT"));
      a.appendChild(lab);
      grid.appendChild(a);
      tiles[b.s] = a;
    });
  }

  function light(slug, brand, animate){
    var t = tiles[slug];
    if (!t || lit[slug]) return false;
    lit[slug] = 1;
    t.classList.add("lit");
    t.querySelector(".tag").textContent = "CLAIMED";
    if (animate){
      t.classList.add("flare");
      setTimeout(function(){ t.classList.remove("flare"); }, 3500);
      say(brand + " just claimed theirs");
    }
    return true;
  }

  function addQueued(brand, animate){
    var k = brand.toLowerCase();
    if (queued[k]) return false;
    queued[k] = 1;
    var a = el("div","tile queued" + (animate ? " new" : ""));
    a.appendChild(el("div","shot","QUEUED"));
    var lab = el("div","lab");
    lab.appendChild(el("span","nm",brand));
    lab.appendChild(el("span","tag","NEXT"));
    a.appendChild(lab);
    grid.appendChild(a);
    if (animate) say(brand + " joined the queue");
    return true;
  }

  var tOut;
  function say(msg){
    var t = document.getElementById("ticker");
    t.textContent = "→ " + msg;
    t.classList.add("on");
    clearTimeout(tOut);
    tOut = setTimeout(function(){ t.classList.remove("on"); }, 6500);
  }

  function paint(d){
    (d.events || []).forEach(function(e){
      var k = e.kind + "|" + e.brand.toLowerCase() + "|" + e.ts;
      if (seen[k]) return;
      seen[k] = 1;
      if (e.kind === "match" && e.slug) light(e.slug, e.brand, !firstPass);
      else if (e.kind === "queue") addQueued(e.brand, !firstPass);
    });
    document.getElementById("c-lit").textContent = Object.keys(lit).length;
    document.getElementById("c-q").textContent = Object.keys(queued).length;
    refit();
    firstPass = false;
  }

  // Fit every tile on screen. A brand that walks up during the talk and lands in a
  // clipped row is worse than a slightly smaller wall.
  function refit(){
    var main = grid.parentElement;
    var W = main.clientWidth, H = main.clientHeight, n = grid.children.length;
    if (!W || !H || !n) return;
    var gap = 8, best = 56;
    for (var w = 170; w >= 56; w -= 2){
      var cols = Math.max(1, Math.floor((W + gap) / (w + gap)));
      var rows = Math.ceil(n / cols);
      var th = w * 1.25 + 22;                       // 4:5 art + label
      if (rows * (th + gap) - gap <= H){ best = w; break; }
    }
    grid.style.setProperty("--tile", best + "px");
  }
  addEventListener("resize", refit);

  function mark(ok){
    document.getElementById("dot").className = "dot" + (ok ? "" : " stale");
    document.getElementById("status").textContent = ok ? "Live" : "Reconnecting";
  }

  function poll(){
    fetch(FEED,{cache:"no-store"}).then(function(r){return r.json();})
      .then(function(d){ if(d && d.ok){ paint(d); mark(true);} else mark(false); })
      .catch(function(){ mark(false); });   // hold the last frame rather than blanking
  }

  build();
  document.getElementById("c-built").textContent = BRANDS.length;
  refit();
  poll(); setInterval(poll, 2000);

  // F fullscreen for the projector · R reset the claimed state for a rehearsal run
  addEventListener("keydown", function(ev){
    var k = ev.key.toLowerCase();
    if (k === "f"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    if (k === "r"){
      Object.keys(lit).forEach(function(s){
        var t=tiles[s]; if(t){ t.classList.remove("lit","flare"); t.querySelector(".tag").textContent="BUILT"; }
      });
      lit = Object.create(null); seen = Object.create(null);
      Object.keys(queued).forEach(function(){});
      [].slice.call(grid.querySelectorAll(".tile.queued")).forEach(function(n){ n.remove(); });
      queued = Object.create(null); firstPass = true;
      document.getElementById("c-lit").textContent = 0;
      document.getElementById("c-q").textContent = 0;
      poll();
    }
  });
})();
</script>
</body>
</html>
