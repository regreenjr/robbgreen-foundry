<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EO Phoenix — the room</title>
<meta name="robots" content="noindex">
<style>
  /* The projected board. Counts only — no names, no businesses, no contact details.
     It hangs on a wall in front of ~70 people and the endpoint behind it needs no
     auth, so the safe design is one that has nothing to leak. */
  :root{
    --bg:#0e0e13; --ink:#f2f2f8; --dim:#7a7a8c; --line:#26263300;
    --l1:#9a9aa8; --l2:#3d8dff; --l3:#e8b23a;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:4vh 5vw;gap:4vh}

  .top{display:flex;align-items:baseline;gap:2.4vw}
  .n{font-size:clamp(80px,17vw,260px);line-height:.86;font-weight:800;letter-spacing:-.045em;
    font-variant-numeric:tabular-nums}
  .lab{font-size:clamp(16px,2.1vw,34px);color:var(--dim);letter-spacing:.02em;font-weight:600}

  .bars{display:flex;flex-direction:column;gap:2.2vh}
  .row{display:grid;grid-template-columns:clamp(140px,17vw,300px) 1fr clamp(70px,7vw,130px);
    align-items:center;gap:1.6vw}
  .name{font-size:clamp(17px,2.3vw,38px);font-weight:700;letter-spacing:-.01em}
  .name small{display:block;font-size:.52em;font-weight:500;color:var(--dim);
    letter-spacing:.04em;margin-top:.2em}
  .track{height:clamp(30px,5.4vh,64px);background:#191922;border-radius:6px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:6px;transition:width .7s cubic-bezier(.34,1.2,.4,1)}
  .c1 .fill{background:linear-gradient(90deg,#5b5b68,#9a9aa8)}
  .c2 .fill{background:linear-gradient(90deg,#1e5bb8,#3d8dff)}
  .c3 .fill{background:linear-gradient(90deg,#a87a12,#e8b23a)}
  .c1 .name{color:var(--l1)} .c2 .name{color:var(--l2)} .c3 .name{color:var(--l3)}
  .v{font-size:clamp(24px,3.6vw,60px);font-weight:800;text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .foot{display:flex;justify-content:space-between;align-items:center;
    font-size:clamp(12px,1.35vw,21px);color:var(--dim);letter-spacing:.02em}
  .dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;
    background:#2ee6a0;margin-right:.5em;vertical-align:baseline;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .stale .dot{background:#ff5c72;animation:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="n" id="total">0</div><div class="lab">people have answered</div></div>
  <div class="bars">
    <div class="row c1"><div class="name">Level 1<small>THE GOOGLER</small></div>
      <div class="track"><div class="fill" id="f1"></div></div><div class="v" id="v1">0</div></div>
    <div class="row c2"><div class="name">Level 2<small>THE BUILDER</small></div>
      <div class="track"><div class="fill" id="f2"></div></div><div class="v" id="v2">0</div></div>
    <div class="row c3"><div class="name">Level 3<small>THE ARCHITECT</small></div>
      <div class="track"><div class="fill" id="f3"></div></div><div class="v" id="v3">0</div></div>
  </div>
  <div class="foot" id="foot">
    <div><span class="dot"></span><span id="status">live</span></div>
    <div>robbgreen.com/eo</div>
  </div>
</div>

<script>
(function(){
  var FEED = "https://bfm-demos.vercel.app/api/eo-feed?mins=300";
  var last = 0, misses = 0;

  function paint(d){
    var t = d.total || 0, L = d.levels || {L1:0,L2:0,L3:0};
    document.getElementById('total').textContent = t;
    var max = Math.max(L.L1, L.L2, L.L3, 1);
    [['1',L.L1],['2',L.L2],['3',L.L3]].forEach(function(p){
      document.getElementById('f'+p[0]).style.width = (p[1]/max*100)+'%';
      document.getElementById('v'+p[0]).textContent = p[1];
    });
    last = t;
  }

  function poll(){
    fetch(FEED,{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        misses = 0;
        document.getElementById('foot').classList.remove('stale');
        document.getElementById('status').textContent = 'live';
        if (d && d.ok) paint(d);
      })
      .catch(function(){
        // The board must never go blank mid-room. Hold the last good numbers and
        // flip the indicator so Robb can see it went stale without the room reading
        // an error message off a ten-foot wall.
        if (++misses >= 3){
          document.getElementById('foot').classList.add('stale');
          document.getElementById('status').textContent = 'reconnecting';
        }
      });
  }
  poll(); setInterval(poll, 2000);

  document.addEventListener('keydown', function(e){
    if (e.key === 'f' || e.key === 'F'){
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    if (e.key === 'r' || e.key === 'R') poll();
  });
})();
</script>
</body>
</html>
